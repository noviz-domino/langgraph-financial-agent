[project]
name = "langgraph-financial-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "langsmith>=0.14.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "langgraph-cli[inmem]>=0.4.32",
]
